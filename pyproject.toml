[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coco"
version = "0.1.3a0"
description = "Coco · 轻量化AI编程助手"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "markdown-it-py>=3.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
coco = "core.main:entry"
coco-bench = "benchmarks.run:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["core*", "benchmarks*"]
exclude = ["tests*", "benchmarks.tasks*", "benchmarks.results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
